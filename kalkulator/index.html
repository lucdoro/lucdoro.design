<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
<link rel="apple-touch-icon" href="/assets/icon-180.png">
<meta name="theme-color" content="#f1f0f6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d0d10" media="(prefers-color-scheme: dark)">

<title>Kalkulator wyceny — LucDoroDesign</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Syne:wght@600;700;800&family=Fraunces:ital,opsz,wght@1,9..144,400..700&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d0d10;--acc:#b58cff;--acc2:#7b4dff;--txt:#f2efe8;--mut:#a09a91;--line:#2b2b32;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--txt);font-family:'Manrope',sans-serif;overflow:hidden;min-height:100vh;}

/* TOP NAV — wzorzec z /developer/ */
.top-nav{position:fixed;top:0;left:0;right:0;z-index:100;min-height:65px;background:color-mix(in srgb, var(--bg) 92%, transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid rgba(255,255,255,.1);padding:14px 24px;display:flex;align-items:center;justify-content:space-between;gap:16px;}
.top-nav-back{display:inline-flex;align-items:center;gap:8px;color:var(--txt);text-decoration:none;font-size:14px;font-weight:600;padding:8px 14px;border-radius:999px;border:1px solid rgba(255,255,255,.25);transition:all .2s ease;white-space:nowrap;}
.top-nav-back:hover{border-color:var(--acc);color:var(--acc);transform:translateX(-2px);}
.top-nav-brand{font-family:'Syne',sans-serif;font-weight:700;font-size:15px;color:var(--txt);letter-spacing:.02em;}
.top-nav-links{display:flex;gap:14px;align-items:center;font-size:13px;}
.top-nav-links a{color:var(--mut);text-decoration:none;transition:color .2s;}
.top-nav-links a:hover{color:var(--acc);}
.tn-btn{background:transparent;border:1px solid rgba(255,255,255,.2);color:var(--txt);width:36px;height:36px;border-radius:999px;cursor:pointer;font-size:15px;display:inline-flex;align-items:center;justify-content:center;transition:all .2s;flex:none;}
.tn-btn:hover{border-color:var(--acc);color:var(--acc);}
.tn-btn svg{width:18px;height:18px;display:block}
.tn-btn .ti-sun{display:none}
[data-theme="light"] .tn-btn .ti-moon{display:none}
[data-theme="light"] .tn-btn .ti-sun{display:block}

.tn-lang-btn{width:auto;padding:0 10px;font-family:'Roboto Mono',monospace;font-size:11px;font-weight:700;letter-spacing:1.5px;}
.tn-palette-wrap{position:relative;display:inline-block;}
.tn-palette-menu{position:absolute;top:calc(100% + 8px);right:0;min-width:200px;background:var(--card,#1a1a1e);border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:6px;display:none;flex-direction:column;gap:2px;box-shadow:0 20px 50px -20px rgba(0,0,0,.5);z-index:200;}
.tn-palette-menu.is-open{display:flex;}
.tn-palette-menu button{background:transparent;border:0;color:var(--txt);padding:9px 12px;border-radius:9px;cursor:pointer;font-family:inherit;font-size:13px;text-align:left;display:flex;align-items:center;gap:10px;transition:background .18s;}
.tn-palette-menu button:hover{background:rgba(255,255,255,.06);}
.tn-palette-menu button.is-active{background:color-mix(in srgb, var(--acc) 12%, transparent);color:var(--acc);}
.tn-swatches{display:inline-flex;gap:3px;}
.tn-swatches span{width:14px;height:14px;border-radius:50%;border:1px solid rgba(0,0,0,.15);}

/* SPLIT VIEW */
.split{position:fixed;top:65px;left:0;right:0;bottom:0;display:grid;grid-template-columns:1fr 1fr;}
/* UJEDNOLICONE RAMKI — obie kolumny jako panele (desktop) */
@media(min-width:901px){
  .split{gap:16px;padding:16px;}
  .split-left,.split-right{border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--card);}
  
  
}
.split-left{position:relative;display:flex;flex-direction:column;}
.split-right{position:relative;overflow:hidden;background:var(--bg);}

/* Theme toggle bar — nad iframe (nie overlap) */
.calc-frame{border:0;width:100%;flex:1;background:var(--bg);transition:background .3s;display:block;}
.calc-frame.dark{background:var(--bg);}

/* RIGHT SHOWCASE */
.showcase{position:relative;height:100%;display:flex;flex-direction:column;overflow:hidden;padding:0;}
.showcase-top{flex:1 1 50%;min-height:0;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;}
.showcase-bottom{flex:1 1 50%;min-height:0;overflow-y:auto;border-top:1px solid var(--line);padding:36px 40px;}
.showcase-bottom .showcase-card{max-width:none;}
.showcase-empty--bottom{opacity:.55;max-width:340px;}
.showcase-empty--bottom p{color:var(--mut);font-size:13px;line-height:1.6;}
@media(max-width:900px){
  .showcase-top{flex:none;padding:70px 16px 16px;}
  .showcase-bottom{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:24px 16px;}
}
/* Blob decoracje */

/* Empty state */
.showcase-empty{position:relative;z-index:1;text-align:center;max-width:400px;opacity:.6;}
.showcase-empty-icon{font-size:48px;margin-bottom:20px;}
.showcase-empty h2{font-family:'Fraunces',serif;font-style:italic;font-weight:400;font-size:24px;color:var(--txt);margin-bottom:10px;}
.showcase-empty p{color:var(--mut);font-size:14px;line-height:1.6;}

/* Selected service card */
.showcase-card{position:relative;z-index:1;max-width:520px;width:100%;}
.showcase-eyebrow{font-family:'Roboto Mono',monospace;font-size:11px;letter-spacing:3px;text-transform:uppercase;color:var(--acc);margin-bottom:20px;}
.showcase-name{font-family:'Fraunces',serif;font-style:italic;font-weight:500;font-size:clamp(32px,4vw,56px);line-height:1.1;margin:0 0 24px;color:var(--txt);letter-spacing:-.02em;}
.showcase-price-row{display:flex;align-items:baseline;gap:20px;flex-wrap:wrap;margin-bottom:24px;}
.showcase-price{font-family:'Syne',sans-serif;font-weight:800;font-size:clamp(48px,6vw,80px);color:var(--acc);line-height:1;}
.showcase-price-unit{color:var(--mut);font-size:14px;font-family:'Roboto Mono',monospace;letter-spacing:.5px;}
.showcase-market-mine{color:#3E9C6B;}  /* zielen "taniej" — czytelna i na kremie, i na ciemnym; --ok tu nie istnieje */
.showcase-market{color:var(--mut);font-size:13px;margin-bottom:24px;padding:12px 16px;background:rgba(255,255,255,.03);border-left:2px solid var(--acc);border-radius:0 8px 8px 0;}
.showcase-market b{color:var(--txt);}
.showcase-desc{color:var(--mut);line-height:1.75;font-size:14px;margin-bottom:28px;}
.showcase-features{list-style:none;padding:0;margin:0 0 32px;display:flex;flex-direction:column;gap:10px;}
.showcase-features li{padding-left:24px;position:relative;font-size:13.5px;color:var(--txt);}
.showcase-features li::before{content:"✦";position:absolute;left:0;color:var(--acc);font-size:12px;top:2px;}
.showcase-cta{display:inline-flex;align-items:center;gap:10px;padding:14px 24px;background:var(--wa-bg);color:var(--wa-fg);text-decoration:none;border-radius:12px;font-weight:700;font-size:13px;letter-spacing:.3px;box-shadow:none;transition:transform .2s;}
.showcase-cta:hover{transform:translateY(-2px);}

/* KOLEKCJE — floating panel top-right of right column */
.collections-btn{position:absolute;top:14px;right:14px;z-index:20;background:var(--wa-bg);backdrop-filter:blur(12px);border:1px solid transparent;color:var(--wa-fg);padding:10px 16px;border-radius:12px;font-family:inherit;font-size:12px;font-weight:800;letter-spacing:.5px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;transition:all .2s;box-shadow:0 8px 26px rgba(var(--wa-shadow),.45);}
.collections-btn:hover{transform:translateY(-1px) scale(1.03);box-shadow:0 10px 30px rgba(var(--wa-shadow),.6);}
.collections-btn .cnt{background:var(--acc);color:#fff;font-family:'Roboto Mono',monospace;font-size:10px;padding:2px 7px;border-radius:99px;font-weight:800;}
.collections-panel{position:absolute;top:56px;right:14px;width:340px;max-width:calc(100% - 28px);max-height:calc(100% - 70px);background:var(--card);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--line);border-radius:16px;padding:16px;z-index:21;display:none;flex-direction:column;gap:14px;overflow-y:auto;box-shadow:0 24px 60px rgba(0,0,0,.6);}
.collections-panel.is-open{display:flex;animation:panelIn .3s cubic-bezier(.22,1,.36,1);}
@keyframes panelIn{from{opacity:0;transform:translateY(-8px);}to{opacity:1;transform:none;}}
.cp-section-title{font-family:'Roboto Mono',monospace;font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--mut);font-weight:700;margin-bottom:2px;}
.cp-preset,.cp-saved{background:color-mix(in srgb, var(--txt) 6%, transparent);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;transition:all .18s;}
.cp-preset:hover,.cp-saved:hover{border-color:color-mix(in srgb, var(--acc) 50%, transparent);background:color-mix(in srgb, var(--txt) 6%, transparent);}
.cp-name{font-weight:700;color:var(--txt);font-size:13.5px;display:flex;align-items:center;justify-content:space-between;gap:8px;}
.cp-name .cp-price{font-family:'Syne',sans-serif;font-weight:800;color:var(--wa-bg);font-size:14px;}
.cp-items{color:var(--mut);font-size:11.5px;line-height:1.5;}
.cp-actions{display:flex;gap:6px;margin-top:6px;}
.cp-btn{flex:1;background:transparent;border:1px solid var(--line);color:var(--txt);padding:6px 10px;border-radius:8px;font-family:inherit;font-size:11px;font-weight:600;cursor:pointer;transition:all .18s;}
.cp-btn:hover{border-color:var(--acc);color:var(--acc);}
.cp-btn.primary{background:var(--wa-bg);border-color:transparent;color:var(--wa-fg);}
.cp-btn.primary:hover{transform:translateY(-1px);color:#fff;}
.cp-btn.danger:hover{border-color:#e07a5f;color:#e07a5f;}
.cp-save-row{display:flex;gap:6px;margin-top:6px;}
.cp-save-row input{flex:1;background:color-mix(in srgb, var(--txt) 6%, transparent);border:1px solid var(--line);color:var(--txt);padding:8px 12px;border-radius:8px;font-family:inherit;font-size:12px;outline:none;}
.cp-save-row input:focus{border-color:var(--acc);}
.cp-empty{color:var(--mut);font-size:11.5px;font-style:italic;text-align:center;padding:12px 0;}

/* Mobile floating "podgląd" button — pokazuje się gdy user kliknął pozycję */
.live-badge{position:absolute;right:16px;bottom:16px;z-index:30;display:none;align-items:center;gap:8px;padding:8px 12px;border-radius:12px;font-size:11px;font-family:inherit;color:var(--txt);background:color-mix(in srgb, var(--card) 94%, transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);opacity:.75;pointer-events:none;}
.live-badge.is-on{display:inline-flex;}
/* Harmonijka opisow — ludzie nie odkrywali, ze pod pozycjami sa opisy.
   Po zlozeniu koszyka dol pokazuje liste pozycji; domyslnie wszystko zwiniete. */
.desc-acc{display:flex;flex-direction:column;gap:12px;}
.desc-hint{font-family:'Roboto Mono',monospace;font-size:10px;letter-spacing:1.6px;text-transform:uppercase;color:var(--mut);margin:0 0 18px;}
.acc-item{border:1px solid var(--line);border-radius:11px;background:var(--card);overflow:hidden;transition:border-color .2s;}
.acc-item.is-open{border-color:var(--line);}
.acc-head{width:100%;display:flex;align-items:center;gap:14px;padding:16px 18px;background:transparent;border:0;color:var(--txt);font-family:inherit;font-size:13.5px;font-weight:600;line-height:1.3;text-align:left;cursor:pointer;transition:color .18s;}
.acc-head:hover{color:var(--acc);}
.acc-num{flex:none;font-family:'Roboto Mono',monospace;font-size:10px;letter-spacing:1px;color:var(--mut);}
.acc-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.acc-price{flex:none;font-family:'Roboto Mono',monospace;font-size:11px;color:var(--mut);}
.acc-chev{flex:none;width:8px;height:8px;border-right:2px solid var(--mut);border-bottom:2px solid var(--mut);transform:rotate(45deg);transition:transform .22s;margin:-3px 2px 0 0;}
.acc-item.is-open .acc-head{border-bottom:2px solid var(--acc);color:var(--txt);}
.acc-item.is-open .acc-chev{transform:rotate(225deg);margin:2px 2px 0 0;}
.acc-body{padding:24px 20px 22px;}
.acc-body .showcase-card{max-width:none;}
.acc-body .showcase-eyebrow{margin-bottom:12px;}
.acc-body .showcase-name{font-size:clamp(24px,2.6vw,34px);margin-bottom:16px;}
.acc-body .showcase-price{font-size:clamp(30px,3.4vw,46px);}
.acc-body .showcase-price-row{margin-bottom:20px;}
.acc-body .showcase-features{margin-bottom:24px;}

.showcase-fab{display:none;position:fixed;bottom:20px;right:20px;z-index:50;background:var(--wa-bg);color:#fff;border:0;padding:14px 22px;border-radius:12px;font-family:inherit;font-weight:800;font-size:13px;letter-spacing:.3px;cursor:pointer;box-shadow:0 12px 32px rgba(123,77,255,.5);transition:transform .2s;}
.showcase-fab:hover,.showcase-fab:active{transform:translateY(-2px);}
.showcase-fab.is-visible{display:inline-flex;align-items:center;gap:8px;animation:fabPop .35s cubic-bezier(.34,1.56,.64,1);}
@keyframes fabPop{from{transform:translateY(20px) scale(.85);opacity:0;}to{transform:none;opacity:1;}}

@media(max-width:900px){
  .split{grid-template-columns:1fr;grid-template-rows:1fr;}
  .split-left{border-right:0;border-bottom:none;height:calc(100vh - 58px);}
  .split-right{position:fixed;top:58px;left:0;right:0;bottom:0;transform:translateY(100%);transition:transform .4s cubic-bezier(.22,1,.36,1);z-index:40;background:var(--bg);}
  .split-right.is-open{transform:translateY(0);}
  .collections-panel{position:fixed;top:auto;right:0;left:0;bottom:0;width:100%;max-width:none;max-height:75vh;border-radius:20px 20px 0 0;padding:20px 16px 24px;-webkit-overflow-scrolling:touch;}
  .collections-btn{top:auto;bottom:80px;right:14px;font-size:11px;padding:8px 14px;}
  /* Close button na mobile inside showcase */
  .showcase-close{display:flex!important;position:absolute;top:16px;right:16px;z-index:5;background:rgba(23,26,33,.85);border:1px solid rgba(255,255,255,.2);color:var(--txt);width:38px;height:38px;border-radius:50%;font-size:20px;line-height:1;padding:0;cursor:pointer;align-items:center;justify-content:center;}
  .top-nav{padding:10px 14px;min-height:58px;}
  .top-nav-brand{display:none;}
  .top-nav-links{gap:10px;font-size:12px;}
  .top-nav-links a{display:none;}
  
  
  
  
  .showcase-price{font-size:44px!important;}
  .showcase-name{font-size:28px!important;}
}
.showcase-close{display:none;}
@media(max-width:640px){
  .top-nav-back{padding:5px 10px;font-size:11px;}
  
  .top-nav{min-height:58px;}
  .split-left{height:calc(100vh - 58px);}
  .split-right{top:58px;}
  .showcase-fab{bottom:14px;right:14px;padding:12px 18px;font-size:12px;}
}

  /* PAKIET — karty uslug obok siebie, siatka dopasowuje sie do liczby pozycji */
  .pkg-head{margin-bottom:22px;}
  .pkg-eyebrow{font-family:'Roboto Mono',monospace;font-size:11px;letter-spacing:3px;text-transform:uppercase;color:var(--acc);margin-bottom:12px;}
  .pkg-title{font-family:'Fraunces',serif;font-style:italic;font-weight:500;font-size:clamp(26px,3vw,40px);line-height:1.1;margin:0 0 14px;color:var(--txt);}
  .pkg-total{display:flex;align-items:baseline;gap:10px;font-family:'Syne',sans-serif;font-weight:800;font-size:clamp(30px,4vw,48px);color:var(--wa-bg);}
  .pkg-total small{font-family:'Roboto Mono',monospace;font-size:12px;font-weight:500;color:var(--mut);letter-spacing:1px;}
  .pkg-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:26px;}
  .pkg-card{background:color-mix(in srgb, var(--txt) 6%, transparent);border:1px solid var(--line);border-radius:12px;padding:16px 16px 18px;display:flex;flex-direction:column;gap:8px;}
  .pkg-card-cat{font-family:'Roboto Mono',monospace;font-size:9.5px;letter-spacing:1.5px;text-transform:uppercase;color:var(--mut);}
  .pkg-card-name{font-family:'Fraunces',serif;font-style:italic;font-size:17px;line-height:1.2;color:var(--txt);}
  .pkg-card-desc{font-size:12px;line-height:1.55;color:var(--mut);flex:1;}
  .pkg-card-foot{display:flex;align-items:baseline;justify-content:space-between;gap:8px;border-top:1px dashed var(--line);padding-top:10px;margin-top:2px;}
  .pkg-card-qty{font-family:'Roboto Mono',monospace;font-size:10.5px;letter-spacing:1px;color:var(--mut);}
  .pkg-card-sum{font-family:'Syne',sans-serif;font-weight:800;font-size:17px;color:var(--txt);}
  .cp-count{font-family:'Roboto Mono',monospace;font-size:9.5px;letter-spacing:1.2px;text-transform:uppercase;color:var(--mut);font-weight:600;white-space:nowrap;padding:3px 8px;border-radius:99px;background:color-mix(in srgb, var(--txt) 6%, transparent);}
  .cp-list{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column;gap:0;border-top:1px dashed var(--line);}
  .cp-list li{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:5px 0;font-size:11.5px;line-height:1.4;color:var(--mut);border-bottom:1px dashed var(--line);}
  .cp-list li:last-child{border-bottom:0;}
  .cp-list li span{flex:1;}
  .cp-list li b{font-family:'Roboto Mono',monospace;font-size:10.5px;color:var(--txt);font-weight:700;white-space:nowrap;}
  .cp-desc{color:var(--mut);font-size:11.5px;line-height:1.5;font-style:italic;}
  /* PARAGON — zywa lista zamawianych uslug, rozwija sie w dol */
  .receipt-wrap{position:relative;width:100%;height:100%;display:flex;flex-wrap:wrap;gap:18px;align-items:flex-start;justify-content:center;overflow:auto;padding:22px 26px;box-sizing:border-box;}
  .receipt-wrap .receipt{flex:1 1 260px;max-width:320px;}
  @media(max-width:900px){.receipt-wrap{flex-direction:column;padding:0;} .receipt-wrap .receipt{max-width:100%;width:100%;}}
  .receipt{position:relative;width:100%;background:var(--paper);border:1px solid var(--paper-line);border-bottom:0;
    border-radius:12px 12px 0 0;padding:20px 18px 30px;font-family:'Roboto Mono',monospace;color:var(--paper-ink);
    /* paragon jest paragonem w kazdej palecie — papier nie zmienia sie z motywem */
    --paper:#FBF8F1; --paper-ink:#1A1815; --paper-mut:#8A8375; --paper-line:#D6CEBC;
    /* delikatny cien — inaczej papier ginie na jasnej palecie; drop-shadow, bo box-shadow nie idzie za zabkami maski */
    filter:drop-shadow(0 5px 14px rgba(0,0,0,.11));
    --paper-acc:color-mix(in srgb, var(--wa-bg) 78%, #000);
    transform-origin:top center;
    -webkit-mask:conic-gradient(from -45deg at bottom, #0000, #000 1deg 89deg, #0000 90deg) 50%/15px 100% repeat-x;
    mask:conic-gradient(from -45deg at bottom, #0000, #000 1deg 89deg, #0000 90deg) 50%/15px 100% repeat-x;}
  .receipt.is-new{animation:unroll .5s cubic-bezier(.22,1,.36,1);}
  @keyframes unroll{from{clip-path:inset(0 0 100% 0);}to{clip-path:inset(0 0 0 0);}}
  /* zabkowana krawedz na dole — jak oderwany paragon */

  .r-head{text-align:center;border-bottom:1px dashed var(--paper-line);padding-bottom:12px;margin-bottom:12px;}
  .r-brand{font-family:'Syne',sans-serif;font-weight:800;font-size:13px;letter-spacing:2px;text-transform:uppercase;}
  .r-sub{font-size:9.5px;letter-spacing:1.5px;color:var(--paper-mut);margin-top:5px;text-transform:uppercase;}
  .r-pkg{margin-top:9px;display:inline-block;font-size:9.5px;letter-spacing:1.2px;text-transform:uppercase;
    color:var(--wa-fg);background:var(--wa-bg);padding:4px 10px;border-radius:8px;font-weight:700;}
  .r-item{margin-bottom:9px;}
  .r-row{display:flex;align-items:baseline;gap:6px;font-size:11.5px;}
  .r-row .r-name{flex:0 1 auto;}
  .r-row .r-fill{flex:1;border-bottom:1px dotted var(--paper-line);transform:translateY(-3px);min-width:8px;}
  .r-row .r-val{white-space:nowrap;font-weight:700;}
  .r-qty{font-size:9.5px;color:var(--paper-mut);letter-spacing:.5px;margin-top:2px;}
  .r-extra .r-name{color:var(--paper-mut);}
  .r-sep{border-top:1px dashed var(--paper-line);margin:12px 0 10px;}
  .r-tot{display:flex;justify-content:space-between;gap:10px;font-size:11px;color:var(--paper-mut);margin-bottom:4px;}
  .r-tot.net{font-size:15px;color:var(--paper-ink);font-weight:700;margin:8px 0 6px;}
  .r-tot.net b{color:var(--paper-acc);}

// THEME + PALETTE + LANG — wzorzec z /developer/
(function(){
  var html = document.documentElement;
  var themeBtn = document.getElementById('tn-theme-btn');
  var palBtn = document.getElementById('tn-palette-btn');
  var palMenu = document.getElementById('tn-palette-menu');
  var frame = document.getElementById('calc-frame');
  if (!themeBtn || !palBtn || !palMenu) return;
  var palChips = palMenu.querySelectorAll('button');

  function applyTheme(t){
    html.setAttribute('data-theme', t);
    themeBtn.title = t === 'dark' ? 'Tryb ciemny' : 'Tryb jasny';
    if (frame) frame.classList.toggle('dark', t === 'dark');
    syncFrame();
    try { localStorage.setItem('theme', t); } catch(e){}
  }
  function applyPal(p){
    if (p && p !== 'default') html.setAttribute('data-palette', p);
    else { html.removeAttribute('data-palette'); p = 'default'; }
    palChips.forEach(function(c){ c.classList.toggle('is-active', c.dataset.palette === p); });
    try { localStorage.setItem('lucdoro-palette', p); } catch(e){}
    syncFrame();
  }
  var frameReady = false;
  function syncFrame(){
    if (!frame || !frameReady) return;
    var t = html.getAttribute('data-theme') || 'dark';
    var p = html.getAttribute('data-palette') || 'default';
    var want = 'calc.html?theme=' + t + '&palette=' + p + '&v=20260911c';
    if (frame.getAttribute('src') !== want) frame.setAttribute('src', want);
  }
  var savedTheme = 'dark', savedPal = 'default';
  try { savedTheme = localStorage.getItem('theme') || 'dark'; } catch(e){}
  try { savedPal = localStorage.getItem('lucdoro-palette') || 'default'; } catch(e){}
  applyTheme(savedTheme); applyPal(savedPal);
  frameReady = true; syncFrame();

  themeBtn.addEventListener('click', function(){
    applyTheme(html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
  });
  palBtn.addEventListener('click', function(e){
    e.stopPropagation();
    var open = palMenu.classList.toggle('is-open');
    palBtn.setAttribute('aria-expanded', open ? 'true' : 'false');
  });
  document.addEventListener('click', function(e){
    if (!palMenu.contains(e.target) && e.target !== palBtn){
      palMenu.classList.remove('is-open');
      palBtn.setAttribute('aria-expanded', 'false');
    }
  });
  palChips.forEach(function(c){
    c.addEventListener('click', function(){
      applyPal(c.dataset.palette);
      palMenu.classList.remove('is-open');
      palBtn.setAttribute('aria-expanded', 'false');
    });
  });
})();

// EN/PL toggle
(function(){
  var btn = document.getElementById('tn-lang-btn');
  if (!btn) return;
  var html = document.documentElement;
  // Wezly nie sa cache'owane: puste stany prawego okna wracaja przez innerHTML,
  // wiec stara NodeList wskazywalaby na elementy odpiete od dokumentu.
  function stamp(root){
    (root || document).querySelectorAll('[data-i18n-en]').forEach(function(el){
      if (el.getAttribute('data-i18n-pl') !== null) return;
      var attr = el.getAttribute('data-i18n-attr');
      el.setAttribute('data-i18n-pl', attr ? (el.getAttribute(attr) || '') : el.innerHTML);
    });
  }
  stamp(document);
  var frame = document.getElementById('calc-frame');
  function syncFrame(lang){
    if (frame && frame.contentWindow) frame.contentWindow.postMessage({type:'set-lang', lang:lang}, '*');
  }
  function apply(lang){
    html.setAttribute('lang', lang);
    btn.textContent = lang === 'en' ? 'PL' : 'EN';
    paint(lang, document);
    try { localStorage.setItem('lucdoro-lang', lang); } catch(e){}
    syncFrame(lang);
    // Paragon i harmonijka opisow sa generowane z JS — statyczny swap ich nie widzi.
    try { window.rerenderRight && window.rerenderRight(); } catch(e){}
  }
  function paint(lang, root){
    stamp(root);
    (root || document).querySelectorAll('[data-i18n-en]').forEach(function(el){
      var val = lang === 'en' ? el.getAttribute('data-i18n-en') : el.getAttribute('data-i18n-pl');
      if (val === null) return;
      var attr = el.getAttribute('data-i18n-attr');
      if (attr) el.setAttribute(attr, val); else el.innerHTML = val;
    });
  }
  // Uzywane po przywroceniu pustego stanu prawego okna z migawki HTML
  window.__i18nStatic = function(root){ paint(html.getAttribute('lang') === 'en' ? 'en' : 'pl', root); };
  var saved = 'pl';
  try { saved = localStorage.getItem('lucdoro-lang') || 'pl'; } catch(e){}
  apply(saved);
  if (frame) frame.addEventListener('load', function(){ syncFrame(html.getAttribute('lang') === 'en' ? 'en' : 'pl'); });
  btn.addEventListener('click', function(){
    apply(html.getAttribute('lang') === 'en' ? 'pl' : 'en');
  });
})();

  if (!presetsEl) return; // panel Kolekcji zyje teraz w calc.html (pod Wycena)
  const composition = (items) => `<ul class="cp-list">${items.map(i =>
    `<li><span>${i.name}</span><b>× ${i.qty}</b></li>`).join('')}</ul>`;

  presetsEl.innerHTML = PRESETS.map(p => `

      <div class="cp-name">${p.name}<span class="cp-count">${p.items.length} poz.</span></div>

    savedEl.innerHTML = saved.map(c => `

        <div class="cp-name">💾 ${c.name}<span class="cp-count">${c.items.length} poz.</span></div>
        ${composition(c.items)}
        <div class="cp-actions">
          <button class="cp-btn primary" data-apply="saved:${c.id}">Zastosuj</button>
          <button class="cp-btn danger" data-delete="${c.id}">🗑</button>
        </div>
      </div>
    `).join('');
  }

  document.getElementById('collections-count').textContent = PRESETS.length + saved.length;

  // Bind actions
  document.querySelectorAll('[data-apply]').forEach(btn => {
    btn.addEventListener('click', () => {
      const [type, id] = btn.dataset.apply.split(':');
      const source = type === 'preset' ? PRESETS : getSaved();
      const collection = source.find(c => c.id === id);
      if (collection) applyCollection(collection);
    });
  });
  document.querySelectorAll('[data-delete]').forEach(btn => {
    btn.addEventListener('click', () => {
      const id = btn.dataset.delete;
      const saved = getSaved().filter(c => c.id !== id);
      saveSaved(saved);
      renderCollections();
    });
  });
}

function applyCollection(collection){
  const iframe = document.getElementById('calc-frame');
  if (!iframe || !iframe.contentWindow) return;
  iframe.contentWindow.postMessage({type:'apply-collection', items:collection.items, name:collection.name}, '*');
}

// Odbiór postMessage z iframe (calc.html wysyła po kliknięciu wiersza + na get-state)
window.addEventListener('message', (e) => {
  if (!e.data) return;
  if (e.data.type === 'service-select') renderShowcase(e.data);
  if (e.data.type === 'selection') renderReceipt(e.data);
  if (e.data.type === 'state'){
    calcCurrentState = e.data.items || [];
  }
});

// Init
renderCollections();

// Auto-zastosuj pakiet z linku (?preset=starter) — np. z kart-paragonów na stronie głównej
(function(){
  const urlPreset = new URLSearchParams(location.search).get('preset');
  if (!urlPreset) return;
  const p = PRESETS.find(x => x.id === urlPreset);
  if (!p) return;
  const iframe = document.getElementById('calc-frame');
  // Uwaga: readyState 'complete' bywa prawda dla about:blank — czekamy na load
  // i dokladamy retry, bo listener w calc.html rejestruje sie dopiero po parsowaniu.
  const tryApply = () => { applyCollection(p); setTimeout(() => applyCollection(p), 400); };
  const src = iframe.getAttribute('src') || '';
  if (iframe.contentWindow && iframe.contentWindow.location.href.indexOf(src.split('?')[0]) !== -1
      && iframe.contentDocument && iframe.contentDocument.readyState === 'complete') {
    tryApply();
  } else {
    iframe.addEventListener('load', tryApply, {once:true});
  }
})();

// ── MOBILE SHOWCASE DRAWER ──
const IS_MOBILE = () => window.matchMedia('(max-width: 900px)').matches;
const splitRight = document.getElementById('split-right');
const showcaseClose = document.getElementById('showcase-close');
const showcaseFab = document.getElementById('showcase-fab');
const fabName = document.getElementById('fab-name');
let lastSelectedName = '';

function openShowcase(){
  splitRight.classList.add('is-open');
  showcaseFab.classList.remove('is-visible');
  document.body.style.overflow = 'hidden';
}
function closeShowcase(){
  splitRight.classList.remove('is-open');
  document.body.style.overflow = '';
  if (IS_MOBILE() && lastSelectedName){
    showcaseFab.classList.add('is-visible');
  }
}
showcaseClose.addEventListener('click', closeShowcase);
showcaseFab.addEventListener('click', openShowcase);
// Close on Esc
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && splitRight.classList.contains('is-open')) closeShowcase();
});

// Hook renderShowcase to auto-open on mobile + update FAB
const _origRenderShowcase = renderShowcase;
renderShowcase = function(data){
  _origRenderShowcase(data);
  lastSelectedName = data.name;
  if (IS_MOBILE()){
    // Skróć nazwę do FAB
    const short = data.name.length > 22 ? data.name.slice(0,20)+'…' : data.name;
    fabName.textContent = short + ' · ' + data.price + ' zł';
    // Szuflada NIE otwiera sie sama. Przy kazdym tapnieciu w pozycje zaslaniala
    // caly cennik, wiec skladanie wyceny z kilku pozycji znaczylo zamykanie jej
    // po kazdym kliknieciu. Zamiast tego zapala sie przycisk podgladu i to
    // uzytkownik decyduje, kiedy chce zobaczyc paragon.
    if (!splitRight.classList.contains('is-open')) showcaseFab.classList.add('is-visible');
  }
};
// On resize — jeśli przechodzi z mobile → desktop, zamknij drawer
window.addEventListener('resize', () => {
  if (!IS_MOBILE()){
    splitRight.classList.remove('is-open');
    document.body.style.overflow = '';
    showcaseFab.classList.remove('is-visible');
  } else if (lastSelectedName){
    showcaseFab.classList.add('is-visible');
  }
});



// ── PARAGON: zywa lista zamawianych uslug ────────────────────────────────────
let lastReceiptKey = '';

// Pakiet "powstaje" sam, gdy wybor zawiera komplet jego pozycji
function matchPreset(items){
  const have = {};
  items.forEach(i => { have[i.name] = i.qty; });
  let best = null;
  PRESETS.forEach(p => {
    const full = p.items.every(pi => (have[pi.name] || 0) >= pi.qty);
    if (full && (!best || p.items.length > best.items.length)) best = p;
  });
  return best;
}

function renderReceipt(data){
  lastReceiptData = data;
  const items = (data.items || []).filter(i => i.qty > 0);
  const top = document.getElementById('showcase-top');
  const prevCount = cartCount;
  cartCount = items.length;
  if (!items.length){
    lastReceiptKey = '';
    tabItems = []; tabActive = ''; lastTabKey = '';
    const bot = document.getElementById('showcase-bottom');
    // Ramka przysyla puste 'selection' takze wtedy, gdy koszyk od poczatku byl pusty
    // (np. po przeliczeniu przy zmianie jezyka). Wtedy nie kasujemy podgladu pozycji.
    if (prevCount === 0 && lastShowcaseData){ renderShowcase(lastShowcaseData); return false; }
    lastShowcaseData = null;
    top.innerHTML = EMPTY_TOP;
    bot.innerHTML = EMPTY_BOTTOM;
    i18nStatic(top); i18nStatic(bot);
    return false;
  }

  const pkg = matchPreset(items);
  const inPkg = pkg ? pkg.items.map(i => i.name) : [];
  const pkgItems = pkg ? items.filter(i => inPkg.indexOf(i.name) !== -1) : [];
  const extraItems = items.filter(i => inPkg.indexOf(i.name) === -1);
  const finalItems = pkg ? extraItems : items;

  const line = (i) => `
    <div class="r-item">
      <div class="r-row"><span class="r-name">${nameOf(i.name)}</span><span class="r-fill"></span><span class="r-val">${money(i.sum)}</span></div>
      <div class="r-qty">${i.qty} × ${money(i.price)}</div>
    </div>`;

  const e = data.extras || {};
  const addon = (label, val) => val > 0 ? `<div class="r-tot"><span>${label}</span><span>${money(val)}</span></div>` : '';

  const orderLines = items.map(i => `• ${nameOf(i.name)} × ${i.qty} — ${money(i.sum)}`).join('\n');
  const wa = 'https://wa.me/48795758555?text=' + encodeURIComponent(
    (pkg ? t('waPkg') + pkg.name + (extraItems.length ? t('waExtra') : ':\n') : t('waQuote'))
    + orderLines + t('waTotal') + money(data.net));

  const key = items.map(i => i.name + ':' + i.qty).join('|') + '#' + Math.round(data.net);
  const isNew = lastReceiptKey.split('#')[0] !== key.split('#')[0];
  lastReceiptKey = key;

  const pkgSum = pkgItems.reduce((s, i) => s + i.sum, 0);

  const pkgReceiptHTML = pkg ? `
    <div class="receipt ${isNew ? 'is-new' : ''}">
      <div class="r-head">
        <div class="r-brand">LucDoroDesign</div>
        <div class="r-sub">${t('pkg')} · ${nItems(pkgItems.length)}</div>
        <div class="r-pkg">${pkg.name}</div>
      </div>
      ${pkgItems.map(line).join('')}
      <div class="r-sep"></div>
      <div class="r-tot net"><span>${t('pkgSum')}</span><b>${money(pkgSum)}</b></div>
      <div class="r-foot">${t('pkgFoot')}</div>
    </div>` : '';

  const finalTitle = pkg ? (finalItems.length ? t('extraSel') : t('orderSum')) : t('quote');
  const finalReceiptHTML = `
    <div class="receipt ${isNew ? 'is-new' : ''}">
      <div class="r-head">
        <div class="r-brand">LucDoroDesign</div>
        <div class="r-sub">${finalTitle}${finalItems.length ? ' · ' + nItems(finalItems.length) : ''}</div>
      </div>
      ${finalItems.map(line).join('')}
      ${finalItems.length ? '<div class="r-sep"></div>' : ''}
      ${addon(t('rush'), e.rush)}
      ${addon(t('rev'), e.rev)}
      ${addon(t('call'), e.call)}
      ${addon(t('del'), e.del)}
      ${e.disc > 0 ? `<div class="r-tot"><span>${t('disc')}</span><span>−${money(e.disc)}</span></div>` : ''}
      <div class="r-tot net"><span>${t('netTotal')}</span><b>${money(data.net)}</b></div>
      ${data.vatOn ? `<div class="r-tot"><span>${t('vat')}</span><span>${money(data.vat)}</span></div>
      <div class="r-tot"><span>${t('gross')}</span><span>${money(data.gross)}</span></div>` : ''}
      <a class="r-cta" href="${wa}" target="_blank" rel="noopener">${t('ctaOrder')}</a>
      <div class="r-foot">${t('foot')}</div>
    </div>`;

  top.innerHTML = `<div class="receipt-wrap">${pkgReceiptHTML}${finalReceiptHTML}</div>`;
  lastSelectedName = pkg ? pkg.name : (items[0] && items[0].name) || '';

  // Harmonijka przebudowuje sie tylko gdy zmienil sie sklad — inaczej odswiezamy
  // otwarta karte, zeby zmiana ilosci nie zwijala tego, co user wlasnie czyta.
  const tabKey = items.map(i => i.name).join('|');
  if (tabKey !== lastTabKey){ lastTabKey = tabKey; renderDescAcc(items, tabActive); }
  else { tabItems = items; if (tabActive) openDesc(tabActive); }
  return true;
}

let lastReceiptData = null;  // ostatni stan koszyka — do przerysowania po zmianie jezyka
let lastShowcaseData = null; // ostatnia kliknięta pojedyncza pozycja
let cartCount = 0;   // ile pozycji ma koszyk — podglad pojedynczej pozycji nie moze nadpisac sumy
const EMPTY_TOP = document.getElementById('showcase-top').innerHTML;
const EMPTY_BOTTOM = document.getElementById('showcase-bottom').innerHTML;

function renderPackage(data){
  const items = (data.items || []).filter(i => i.qty > 0);
  if (!items.length) return;
  const cards = items.map(i => {
    const d = detailsOf(i.name) || {};
    const desc = (d.desc || '').split('. ')[0].replace(/\.\s*$/, '');
    return `
      <div class="pkg-card">
        <div class="pkg-card-cat">${d.cat || i.group || t('service')}</div>
        <div class="pkg-card-name">${nameOf(i.name)}</div>
        ${desc ? `<div class="pkg-card-desc">${desc}.</div>` : ''}
        <div class="pkg-card-foot">
          <span class="pkg-card-qty">${i.qty} × ${money(i.price)}</span>
          <span class="pkg-card-sum">${money(i.sum)}</span>
        </div>
      </div>`;
  }).join('');
  const lines = items.map(i => `• ${nameOf(i.name)} × ${i.qty} — ${money(i.sum)}`).join('\n');
  document.getElementById('showcase').innerHTML = `
    <div class="showcase-card">
      <div class="pkg-head">
        <div class="pkg-eyebrow">${t('pkg')} · ${nServ(items.length)}</div>
        <h1 class="pkg-title">${data.name}</h1>
        <div class="pkg-total">${money(data.total)} <small>${t('net')}</small></div>
      </div>
      <div class="pkg-grid">${cards}</div>
      <a class="showcase-cta" href="https://wa.me/48795758555?text=${encodeURIComponent(t('waPkg') + data.name + ':\n' + lines + t('waTotal') + money(data.total))}" target="_blank" rel="noopener">
        ${t('ctaPkg')}
      </a>
    </div>
  `;
  lastSelectedName = data.name;
}

// ── HARMONIJKA Z OPISAMI ──
// Opis pojedynczej pozycji byl schowany za kliknieciem wiersza i nikt tego nie
// odkrywal. Przy niepustym koszyku dolne okno listuje pozycje — zwiniete,
// jedna otwarta naraz. Klikniecie wiersza w kalkulatorze rozwija odpowiednia.
let tabItems = [];
let tabActive = '';
let lastTabKey = '';

function descBody(i){
  const d = detailsOf(i.name) || {cat:t('service'), desc:t('fbDesc'), features:[]};
  const feats = (d.features || []).length ? `<ul class="showcase-features">${d.features.map(f => `<li>${f}</li>`).join('')}</ul>` : '';
  return `
    <div class="showcase-card">
      <div class="showcase-eyebrow">${d.cat || t('service')} · ${t('fromList')}</div>
      <h1 class="showcase-name">${nameOf(i.name)}</h1>
      <div class="showcase-price-row">
        <div class="showcase-price">${money(i.price)}</div>
        <div class="showcase-price-unit">${t('netLc')}${i.qty > 1 ? ' · × ' + i.qty : ''}</div>
      </div>
      <p class="showcase-desc">${d.desc || ''}</p>
      ${feats}
      <a class="showcase-cta" href="https://wa.me/48795758555?text=${encodeURIComponent(t('waItem1') + nameOf(i.name) + t('waItem2') + money(i.price) + t('waItem3'))}" target="_blank" rel="noopener">
        ${t('ctaItem')}
      </a>
    </div>`;
}

function renderDescAcc(items, openName){
  tabItems = items;
  tabActive = items.some(i => i.name === openName) ? openName : '';
  const rows = items.map((i, n) => {
    const on = i.name === tabActive;
    return `
      <div class="acc-item${on ? ' is-open' : ''}" data-acc="${n}">
        <button type="button" class="acc-head" aria-expanded="${on}">
          <span class="acc-num">${String(n + 1).padStart(2, '0')}</span>
          <span class="acc-name">${nameOf(i.name)}</span>
          <span class="acc-price">${money(i.price)}</span>
          <span class="acc-chev"></span>
        </button>
        ${on ? `<div class="acc-body">${descBody(i)}</div>` : ''}
      </div>`;
  }).join('');
  document.getElementById('showcase-bottom').innerHTML = `
    <div class="desc-acc-wrap">
      <div class="desc-hint">${t('descHint')}</div>
      <div class="desc-acc">${rows}</div>
    </div>`;
}

// Rozwija wskazana pozycje (i zwija reszte). Zwraca false, gdy jej nie ma na liscie.
function openDesc(name){
  const n = tabItems.findIndex(i => i.name === name);
  if (n < 0) return false;
  const wrap = document.querySelector('#showcase-bottom .desc-acc');
  if (!wrap) return false;
  tabActive = name;
  wrap.querySelectorAll('.acc-item').forEach(el => {
    const on = +el.dataset.acc === n;
    el.classList.toggle('is-open', on);
    el.querySelector('.acc-head').setAttribute('aria-expanded', on);
    const body = el.querySelector('.acc-body');
    if (on && !body) el.insertAdjacentHTML('beforeend', `<div class="acc-body">${descBody(tabItems[n])}</div>`);
    else if (on && body) body.innerHTML = descBody(tabItems[n]);
    else if (body) body.remove();
  });
  return true;
}

function closeDesc(){
  tabActive = '';
  document.querySelectorAll('#showcase-bottom .acc-item').forEach(el => {
    el.classList.remove('is-open');
    el.querySelector('.acc-head').setAttribute('aria-expanded', false);
    const body = el.querySelector('.acc-body');
    if (body) body.remove();
  });
}

document.getElementById('showcase-bottom').addEventListener('click', (ev) => {
  const h = ev.target.closest('.acc-head');
  if (!h || !tabItems.length) return;
  const it = tabItems[+h.parentElement.dataset.acc];
  if (!it) return;
  if (tabActive === it.name) closeDesc(); else openDesc(it.name);
});

function renderShowcase(data){
  const {price, market} = data;
  // Ramka wysyla nazwe tak, jak stoi w tabeli — po EN, gdy jezyk przelaczony.
  // Klucz sprowadzamy do polskiego, wyswietlamy przez nameOf().
  const key = plKey(data.key || data.name);
  lastShowcaseData = {key: key, price: price, market: market};
  const name = nameOf(key);
  const details = detailsOf(key) || {cat: t('service'), desc: t('fbDesc'), features: []};
  const featHTML = details.features.length ? `<ul class="r-feat">${details.features.map(f => `<li>${f}</li>`).join('')}</ul>` : '';
  const marketHTML = market ? `<div class="r-tot"><span>${t('market')}</span><span>${money(market)}</span></div>
      <div class="r-tot r-save"><span>${t('save')}</span><span>${Math.round((market-price)/market*100)}%</span></div>` : '';
  const marketCardHTML = market ? `<div class="showcase-market">${t('market')}: <b>${money(market)}</b>${t('mine')}<b class="showcase-market-mine">${money(price)}</b>${t('eqSave')}<b>${Math.round((market-price)/market*100)}%</b></div>` : '';

  // Górne okno — podglad JEDNEJ pozycji tylko gdy koszyk pusty.
  // Przy niepustym koszyku gora nalezy do zsumowanego paragonu z renderReceipt().
  if (cartCount === 0) document.getElementById('showcase-top').innerHTML = `
    <div class="receipt-wrap">
      <div class="receipt is-new">
        <div class="r-head">
          <div class="r-brand">LucDoroDesign</div>
          <div class="r-sub">${t('preReceipt')}</div>
          <div class="r-pkg">${details.cat} · ${t('fromList')}</div>
        </div>
        <div class="r-item">
          <div class="r-row"><span class="r-name">${name}</span><span class="r-fill"></span><span class="r-val">${money(price)}</span></div>
        </div>
        <div class="r-sep"></div>
        ${marketHTML}
        <div class="r-tot net"><span>${t('net')}</span><b>${money(price)}</b></div>
        <a class="r-cta" href="https://wa.me/48795758555?text=${encodeURIComponent(t('waItem1') + name + t('waItem2') + money(price) + t('waItem3'))}" target="_blank" rel="noopener">
          ${t('ctaItem')}
        </a>
        <div class="r-foot">${t('foot')}</div>
      </div>
    </div>
  `;

  // Dolne okno — przy niepustym koszyku dol nalezy do teczki, wiec klikniecie
  // wiersza ma tylko przelaczyc zakladke, nie zdmuchnac calego paska.
  if (cartCount > 0 && openDesc(key)) return;

  // Dolne okno — opis (jak dawniej)
  document.getElementById('showcase-bottom').innerHTML = `
    <div class="showcase-card">
      <div class="showcase-eyebrow">${details.cat} · ${t('fromList')}</div>
      <h1 class="showcase-name">${name}</h1>
      <div class="showcase-price-row">
        <div class="showcase-price">${money(price)}</div>
        <div class="showcase-price-unit">${t('netLc')}</div>
      </div>
      ${marketCardHTML}
      <p class="showcase-desc">${details.desc}</p>
      ${featHTML ? `<ul class="showcase-features">${details.features.map(f => `<li>${f}</li>`).join('')}</ul>` : ''}
      <a class="showcase-cta" href="https://wa.me/48795758555?text=${encodeURIComponent(t('waItem1') + name + t('waItem2') + money(price) + t('waItem3'))}" target="_blank" rel="noopener">
        ${t('ctaItem')}
      </a>
    </div>
  `;
}

// Przemalowanie prawej strony po przelaczeniu jezyka. Paragon i harmonijka nie maja
// atrybutow data-i18n — buduje je JS, wiec trzeba je wygenerowac od nowa.
window.rerenderRight = function(){
  const has = lastReceiptData && (lastReceiptData.items || []).some(i => i.qty > 0);
  if (has){
    lastReceiptKey = ''; lastTabKey = '';   // wymus pelne przerysowanie, nie tylko odswiezenie karty
    renderReceipt(lastReceiptData);
    return;
  }
  if (lastShowcaseData){ renderShowcase(lastShowcaseData); return; }
  const top = document.getElementById('showcase-top');
  const bot = document.getElementById('showcase-bottom');
  if (top){ top.innerHTML = EMPTY_TOP; i18nStatic(top); }
  if (bot){ bot.innerHTML = EMPTY_BOTTOM; i18nStatic(bot); }
};
</script>
<script>
/* oznacz w menu link do strony, na ktorej jestesmy */
(function(){
  var here=location.pathname.replace(/index\.html$/,'').replace(/\/+$/,'')||'/';
  document.querySelectorAll('.nav-links a[href], .mobile-nav a[href]').forEach(function(a){
    var u; try{ u=new URL(a.getAttribute('href'), location.href); }catch(e){ return; }
    if(u.host!==location.host||u.hash) return;
    var p=u.pathname.replace(/index\.html$/,'').replace(/\/+$/,'')||'/';
    if(p===here) a.setAttribute('aria-current','page');
  });
})();
</script>

<style>
/* Na telefonie rola przycisku podgladu przechodzi na "Zamawiam" w stosie —
   dwa plywajace guziki w tym samym rogu wykluczaly sie nawzajem. */
@media(max-width:900px){ .showcase-fab{display:none!important} }
</style>
<script>
// Paragon wyjezdza spod stosu na "Zamawiam" i chowa sie, gdy ktos dokłada
// kolejna pozycje — wtedy znow liczy sie cennik, nie podsumowanie.
window.addEventListener('message', function(e){
  var d = e.data;
  if (!d || !IS_MOBILE()) return;
  if (d.type === 'order'){
    if (!splitRight.classList.contains('is-open')) openShowcase();
  } else if (d.type === 'stack-add'){
    if (splitRight.classList.contains('is-open')) closeShowcase();
  }
});
</script>
